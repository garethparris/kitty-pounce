name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run pytest

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # kitty is not pip-installable; resolve its internal types by cloning
      # its source as a sibling directory (see CONTRIBUTING.md).
      - run: git clone --depth 1 https://github.com/kovidgoyal/kitty.git ../kitty
      - run: uv run pyright pounce.py
      - run: uv run pyright tests
